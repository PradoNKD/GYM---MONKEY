# Pinar as actions por SHA (exigencia de seguranca: tag e mutavel, commit nao)
# tem um custo: o SHA nunca mais muda sozinho, nem quando a versao nova conserta
# uma falha. Sem este arquivo, a correcao de hoje vira o problema de daqui a um
# ano. O Dependabot reabre a porta de um jeito controlado -- ele atualiza o SHA
# E o comentario da versao, e o CI decide se passa.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'

  # Backend e frontend tem package.json separados, entao sao duas entradas.
  #
  # Os grupos NAO sao por prod/dev sozinho, e isso foi aprendido errando: a
  # primeira versao deste arquivo agrupava so por dependency-type, e o Dependabot
  # partiu o major do NestJS em dois PRs -- @nestjs/core no de producao, e
  # @nestjs/testing no de desenvolvimento. Como @nestjs/testing@12 exige
  # @nestjs/core@^12, cada PR sozinho era impossivel de mergear, e juntos
  # conflitavam no package-lock.json. Pacote que sobe de major junto precisa
  # viver no mesmo grupo. A ordem importa: o primeiro padrao que casa ganha.
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
      producao:
        dependency-type: production
      desenvolvimento:
        dependency-type: development

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Mesmo motivo: react e @types/react precisam subir de major juntos.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      producao:
        dependency-type: production
      desenvolvimento:
        dependency-type: development
