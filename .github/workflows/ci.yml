name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execucoes antigas do mesmo branch quando chega um push novo,
# para nao gastar minutos rodando codigo que ja foi substituido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# O CI so le o codigo e roda teste: nao publica, nao comenta, nao abre PR.
# Sem este bloco o GITHUB_TOKEN herda o padrao do repositorio, que pode ser
# read/write -- credencial de escrita exposta a um step que nao precisa dela.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Postgres de servico: um container efemero, novo a cada run, para os
    # testes rodarem contra o mesmo motor que a producao (Neon), e nao contra
    # um banco diferente que mascararia diferencas de comportamento.
    services:
      postgres:
        # PG 18 para casar com o Neon (producao), que roda Postgres 18.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_monkey_test
        ports:
          - 5432:5432
        # Espera o Postgres aceitar conexao antes de comecar os steps.
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_monkey_test?schema=public

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instala dependencias
        run: npm ci

      - name: Gera o Prisma Client
        run: npx prisma generate

      - name: Checa tipos
        run: npx tsc --noEmit

      - name: Testes unitarios
        run: npm test

      # Nao precisa de .env: test/jest-e2e.setup.js define DATABASE_URL (a
      # partir do TEST_DATABASE_URL acima) e JWT_SECRET, e o pretest:e2e roda
      # as migrations no Postgres de servico.
      - name: Testes e2e
        run: npm run test:e2e

  frontend:
    name: Frontend (lint + testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # Roda o build por ultimo porque ele tambem checa os tipos (tsc -b):
      # ja aconteceu de os testes passarem e o build falhar por erro de tipo.
      - name: Build
        run: npm run build
