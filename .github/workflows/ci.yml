name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execucoes antigas do mesmo branch quando chega um push novo,
# para nao gastar minutos rodando codigo que ja foi substituido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + 51 testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instala dependencias
        run: npm ci

      - name: Gera o Prisma Client
        run: npx prisma generate

      - name: Checa tipos
        run: npx tsc --noEmit

      - name: Testes unitarios
        run: npm test

      # Nao precisa de .env: test/jest-e2e.setup.js define DATABASE_URL e
      # JWT_SECRET, e o pretest:e2e cria o SQLite de teste do zero.
      - name: Testes e2e
        run: npm run test:e2e

  frontend:
    name: Frontend (build + 92 testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # Roda o build por ultimo porque ele tambem checa os tipos (tsc -b):
      # ja aconteceu de os testes passarem e o build falhar por erro de tipo.
      - name: Build
        run: npm run build
