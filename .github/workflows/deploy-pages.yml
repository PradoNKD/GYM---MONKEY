name: Deploy frontend (GitHub Pages)

# Publica o frontend no GitHub Pages a cada push na main que mexa no frontend.
# O backend NAO e publicado aqui - ele roda no Render (deploy automatico do
# proprio Render a partir do GitHub).
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

# Sem bloco de permissao no nivel do workflow: 'pages: write' e
# 'id-token: write' sao o poder de publicar no site e de pedir um token OIDC em
# nome do repositorio. Dar isso ao job de build -- que roda 'npm ci', ou seja,
# codigo de terceiros -- e entregar a chave de publicacao a quem so precisa
# compilar. Cada job declara o que usa, logo abaixo.

# Uma publicacao por vez; nao cancela uma que ja esta no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build do frontend
    runs-on: ubuntu-latest
    # So le o repositorio e sobe um artefato. Nao publica nada.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # A URL da API (Render) e obrigatoria: sem ela o build cairia no fallback
      # http://localhost:3000 e o site publicado nao falaria com backend nenhum.
      # Defina em Settings > Secrets and variables > Actions > Variables:
      #   VITE_API_URL = https://<seu-servico>.onrender.com
      # O valor chega por 'env', e nao interpolado no corpo do script: '${{ }}'
      # e substituido como TEXTO antes de o shell existir, entao um valor com
      # aspas ou ';' viraria comando. Como variavel de ambiente ele e dado.
      - name: Confere VITE_API_URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::A variavel de repositorio VITE_API_URL nao esta definida."
            echo "Defina em Settings > Secrets and variables > Actions > Variables com a URL do backend no Render."
            exit 1
          fi

      - name: Instala dependencias
        run: npm ci

      - name: Build
        env:
          # Subcaminho do Pages (nome do repositorio). No runner Linux nao ha a
          # conversao de path do Git Bash, entao o valor vai limpo.
          VITE_BASE: /GYM---MONKEY/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Prepara artefato do Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: frontend/dist

  deploy:
    name: Publica no Pages
    needs: build
    runs-on: ubuntu-latest
    # Aqui sim: publicar exige 'pages: write', e o deploy-pages troca o token
    # OIDC ('id-token: write') pela credencial de publicacao.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
